    <path d="M0,0 L0,-52 Q38,-64 68,-52 L68,46 Q38,30 0,36 Z" stroke-width="2"/>
    <path d="M0,-52 L0,36" stroke-width="2.5"/>
    <line x1="-58" y1="-38" x2="-9" y2="-34" stroke-width="1" opacity="0.5"/>
    <line x1="-58" y1="-26" x2="-9" y2="-22" stroke-width="1" opacity="0.5"/>
    <line x1="-58" y1="-14" x2="-9" y2="-10" stroke-width="1" opacity="0.5"/>
    <line x1="-58" y1="-2" x2="-9" y2="2" stroke-width="1" opacity="0.5"/>
    <line x1="-58" y1="10" x2="-9" y2="14" stroke-width="1" opacity="0.45"/>
    <line x1="-58" y1="22" x2="-9" y2="26" stroke-width="1" opacity="0.38"/>
    <line x1="58" y1="-38" x2="9" y2="-34" stroke-width="1" opacity="0.5"/>
    <line x1="58" y1="-26" x2="9" y2="-22" stroke-width="1" opacity="0.5"/>
    <line x1="58" y1="-14" x2="9" y2="-10" stroke-width="1" opacity="0.5"/>
    <line x1="58" y1="-2" x2="9" y2="2" stroke-width="1" opacity="0.5"/>
    <line x1="58" y1="10" x2="9" y2="14" stroke-width="1" opacity="0.45"/>
    <line x1="58" y1="22" x2="9" y2="26" stroke-width="1" opacity="0.38"/>
  </g>
  <!-- Stacked books bottom-left -->
  <g transform="translate(16, 180)">
    <rect x="0" y="-44" width="64" height="12" rx="2" fill="#3b82f6" opacity="0.52"/>
    <rect x="4" y="-32" width="58" height="12" rx="2" fill="#dc2626" opacity="0.48"/>
    <rect x="2" y="-20" width="62" height="12" rx="2" fill="#16a34a" opacity="0.48"/>
    <rect x="0" y="-8" width="66" height="14" rx="2" fill="#d97706" opacity="0.52"/>
  </g>
  <!-- Pencil top-right -->
  <g transform="translate(196, 38) rotate(38)">
    <rect x="-5" y="-48" width="10" height="76" rx="2" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
    <rect x="-5" y="-56" width="10" height="10" rx="1" fill="#9ca3af" stroke="#6b7280" stroke-width="1.2"/>
    <polygon points="-5,28 5,28 0,44" fill="#fca5a5" stroke="#92400e" stroke-width="1.5"/>
    <line x1="-1" y1="40" x2="1" y2="40" stroke="#374151" stroke-width="1.5"/>
  </g>
  <!-- Bookmark top-left -->
  <g transform="translate(12, 18)">
    <rect x="0" y="0" width="18" height="30" rx="2" fill="#a855f7" opacity="0.5" stroke="#7c3aed" stroke-width="1.4"/>
    <path d="M0 21 L9 29 L18 21" fill="#6d28d9" opacity="0.65" stroke="none"/>
