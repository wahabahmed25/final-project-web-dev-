<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <rect width="240" height="240" fill="#f4f7fc"/>
  <!-- Graduation cap top-left -->
  <g transform="translate(38, 48)">
    <polygon points="0,-22 40,0 0,22 -40,0" fill="#1e3a5f" opacity="0.52" stroke="#1e3a5f" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="-14" y="-4" width="28" height="24" rx="3" fill="#1e3a5f" opacity="0.48"/>
    <line x1="40" y1="0" x2="40" y2="22" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="40" cy="24" r="4" fill="#d97706" opacity="0.65"/>
  </g>
  <!-- Ruler diagonal center -->
  <g transform="translate(120, 120) rotate(-30)">
    <rect x="-80" y="-8" width="160" height="16" rx="3" fill="none" stroke="#6b7280" stroke-width="1.5" opacity="0.55"/>
    <rect x="-80" y="-8" width="160" height="16" rx="3" fill="#f3f4f6" opacity="0.4"/>
    <line x1="-60" y1="-8" x2="-60" y2="0" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/>
    <line x1="-40" y1="-8" x2="-40" y2="2" stroke="#6b7280" stroke-width="1.5" opacity="0.55"/>
    <line x1="-20" y1="-8" x2="-20" y2="0" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="-8" x2="0" y2="2" stroke="#6b7280" stroke-width="1.5" opacity="0.55"/>
    <line x1="20" y1="-8" x2="20" y2="0" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/>
    <line x1="40" y1="-8" x2="40" y2="2" stroke="#6b7280" stroke-width="1.5" opacity="0.55"/>
    <line x1="60" y1="-8" x2="60" y2="0" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/>
  </g>
  <!-- Pencil top-right -->
  <g transform="translate(200, 30) rotate(20)">
    <rect x="-4" y="-36" width="8" height="60" rx="2" fill="#fde68a" stroke="#92400e" stroke-width="1.3"/>
    <rect x="-4" y="-43" width="8" height="9" rx="1" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
    <polygon points="-4,24 4,24 0,38" fill="#fca5a5" stroke="#92400e" stroke-width="1.3"/>
    <line x1="-1" y1="34" x2="1" y2="34" stroke="#374151" stroke-width="1.2"/>
  </g>
  <!-- Apple bottom-right -->
  <g transform="translate(190, 182)">
    <path d="M20,8 Q28,-6 22,-18 Q14,-28 4,-20 Q-6,-28 -14,-20 Q-20,-8 -12,8 Q-6,22 4,26 Q14,22 20,8 Z" fill="#dc2626" opacity="0.48" stroke="#991b1b" stroke-width="1.4"/>
    <path d="M4,-20 Q8,-30 14,-28" fill="none" stroke="#166534" stroke-width="1.8" stroke-linecap="round"/>
    <ellipse cx="-2" cy="-2" rx="5" ry="8" fill="rgba(255,255,255,0.25)" transform="rotate(-20 -2 -2)"/>
  </g>
  <!-- Notebook lines bottom-left -->
  <g transform="translate(14, 155)">
    <rect x="0" y="0" width="58" height="70" rx="3" fill="white" opacity="0.5" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="8" y1="18" x2="50" y2="18" stroke="#94a3b8" stroke-width="1" opacity="0.7"/>
    <line x1="8" y1="28" x2="50" y2="28" stroke="#94a3b8" stroke-width="1" opacity="0.7"/>
    <line x1="8" y1="38" x2="50" y2="38" stroke="#94a3b8" stroke-width="1" opacity="0.7"/>
    <line x1="8" y1="48" x2="50" y2="48" stroke="#94a3b8" stroke-width="1" opacity="0.7"/>
    <line x1="8" y1="58" x2="50" y2="58" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
    <line x1="18" y1="0" x2="18" y2="70" stroke="#f87171" stroke-width="1" opacity="0.45"/>
    <!-- Spiral binding dots -->
    <circle cx="4" cy="12" r="2.5" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.65"/>
    <circle cx="4" cy="24" r="2.5" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.65"/>
    <circle cx="4" cy="36" r="2.5" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.65"/>
    <circle cx="4" cy="48" r="2.5" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.65"/>
    <circle cx="4" cy="60" r="2.5" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.65"/>
  </g>
</svg>
