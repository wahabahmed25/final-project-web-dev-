<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="rgba(255,255,255,0.06)"/>
  <!-- Red pushpin -->
  <circle cx="24" cy="24" r="9" fill="#e53e3e" opacity="0.38"/>
  <circle cx="21.5" cy="21.5" r="3.5" fill="rgba(255,200,200,0.65)"/>
  <line x1="24" y1="33" x2="24" y2="50" stroke="#a0aec0" stroke-width="1.6" stroke-linecap="round" opacity="0.42"/>
  <!-- Blue pushpin -->
  <circle cx="158" cy="38" r="8" fill="#3182ce" opacity="0.34"/>
  <circle cx="155.5" cy="35.5" r="3" fill="rgba(180,210,255,0.6)"/>
  <line x1="158" y1="46" x2="158" y2="62" stroke="#a0aec0" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
  <!-- Yellow pushpin -->
  <circle cx="80" cy="172" r="8" fill="#d69e2e" opacity="0.36"/>
  <circle cx="77.5" cy="169.5" r="3" fill="rgba(255,240,170,0.6)"/>
  <line x1="80" y1="180" x2="80" y2="196" stroke="#a0aec0" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
  <!-- Green pushpin -->
  <circle cx="178" cy="155" r="7" fill="#2f855a" opacity="0.35"/>
  <circle cx="175.8" cy="152.8" r="2.5" fill="rgba(180,255,200,0.6)"/>
  <line x1="178" y1="162" x2="178" y2="176" stroke="#a0aec0" stroke-width="1.4" stroke-linecap="round" opacity="0.36"/>
  <!-- Star -->
  <polygon points="100,10 104,23 118,23 107,31 111,44 100,36 89,44 93,31 82,23 96,23" fill="#d69e2e" opacity="0.32"/>
  <!-- Arrow right -->
  <path d="M28,98 L56,98 M48,90 L56,98 L48,106" fill="none" stroke="#718096" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.32"/>
  <!-- Arrow down -->
  <path d="M152,70 L152,98 M144,90 L152,98 L160,90" fill="none" stroke="#718096" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.28"/>
  <!-- Squiggle -->
  <path d="M148,120 Q158,113 154,106 Q150,98 160,96 Q170,94 166,104 Q162,115 172,118" fill="none" stroke="#718096" stroke-width="1.8" stroke-linecap="round" opacity="0.30"/>
  <!-- Mini book -->
  <g transform="translate(138,155)" opacity="0.35">
    <rect x="-13" y="-15" width="26" height="30" rx="2" fill="none" stroke="#4a5568" stroke-width="1.6"/>
    <line x1="-13" y1="-15" x2="-13" y2="15" stroke="#4a5568" stroke-width="2.8"/>
    <line x1="-6" y1="-8" x2="9" y2="-8" stroke="#718096" stroke-width="1.1"/>
    <line x1="-6" y1="-1" x2="9" y2="-1" stroke="#718096" stroke-width="1.1"/>
    <line x1="-6" y1="6" x2="9" y2="6" stroke="#718096" stroke-width="1.1"/>
  </g>
  <!-- Coffee drop -->
  <path d="M50,155 Q48,144 55,138 Q66,133 66,145 Q66,160 50,155 Z" fill="#7c4a1e" opacity="0.26"/>
  <!-- Pencil tip -->
  <g transform="translate(28,155) rotate(-35)" opacity="0.32">
    <rect x="-3" y="-22" width="6" height="35" rx="2" fill="#fde68a" stroke="#92400e" stroke-width="1.2"/>
    <polygon points="-3,13 3,13 0,24" fill="#fca5a5" stroke="#92400e" stroke-width="1"/>
  </g>
  <!-- Curly flourish -->
  <path d="M170,58 Q182,64 176,76 Q170,88 182,94" fill="none" stroke="#a0aec0" stroke-width="1.8" stroke-linecap="round" opacity="0.36"/>
  <!-- Small dots -->
  <circle cx="100" cy="100" r="2.8" fill="#a0aec0" opacity="0.32"/>
  <circle cx="116" cy="76" r="2.2" fill="#718096" opacity="0.28"/>
  <circle cx="42" cy="140" r="2.2" fill="#718096" opacity="0.26"/>
  <circle cx="178" cy="172" r="2.5" fill="#a0aec0" opacity="0.30"/>
  <circle cx="62" cy="70" r="2" fill="#d69e2e" opacity="0.30"/>
</svg>
